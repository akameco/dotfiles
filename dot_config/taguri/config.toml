# taguri の設定。仕様は https://github.com/akameco/taguri/blob/main/docs/design.md
# 変えたら `taguri reload` で読み直す。

# Raycast と並べて使う間は cmd+shift+space。移行したら option+space にする
hotkey = "cmd+shift+space"
launch_at_login = true

# Raycast Script Commands（@raycast.* のコメントを持つスクリプト）
script_dirs = ["~/.config/raycast/scripts"]

# パネルの大きさ。scale はパネルの幅と余白の倍率（0.8〜1.6）、text_scale は文字と行の高さの倍率（0.7〜1.6）、
# rows は一覧に見える行数（4〜15）。
# 変えて `taguri reload` すると、アプリが起動し直して反映される
[appearance]
scale = 1.2
text_scale = 0.85
rows = 12

[[plugin]]
name = "apps"
command = ["$TAGURI_PLUGINS/apps.ts"]
root = true

# #5892 / owner/repo#12。既定のリポジトリは TAGURI_GITHUB_REPO（work.zsh）
[[plugin]]
name = "github"
command = ["$TAGURI_PLUGINS/github-issue.ts"]
kind = "query"
match = '^(?:([\w.-]+/[\w.-]+))?#(\d+)$'

# ABC-123。ワークスペースは LINEAR_WORKSPACE（work.zsh）
[[plugin]]
name = "linear"
command = ["$TAGURI_PLUGINS/linear-issue.ts"]
kind = "query"
match = '^([A-Z][A-Z0-9]+-\d+)$'

# ghq のリポジトリ。Enter で herdr、cmd+Enter で VS Code、option+Enter で GitHub
[[plugin]]
name = "repos"
command = ["$TAGURI_PLUGINS/repos.ts"]
root = true

# --- @ で始めるコマンド（@ だけを打つと一覧が出る）---

[[plugin]]
name = "prs"
command = ["$TAGURI_PLUGINS/prs.ts"]
keyword = "pr"
description = "自分の PR とレビュー依頼"

[[plugin]]
name = "claude"
command = ["$TAGURI_PLUGINS/claude.ts"]
kind = "query"
keyword = "ai"
description = "Claude に聞く・クリップボードを要約／翻訳／返信案"

# クリップボード履歴（taguri 本体が記録する）。Enter で貼り付け、⌘Enter でコピーだけ、⌃Enter で履歴から消す
[[plugin]]
name = "clipboard"
command = ["builtin:clipboard"]
keyword = "clip"
description = "クリップボード履歴"

# Raycast 形式の snippets.json。@sn rev 1234 で {argument} に入れて貼る
[[plugin]]
name = "snippets"
command = ["$TAGURI_PLUGINS/snippets.ts"]
kind = "query"
keyword = "sn"
description = "スニペットを貼る"

# Chrome のタブ。Enter で切り替え、⌘Enter で URL をコピー、⌃Enter で閉じる
[[plugin]]
name = "tabs"
command = ["$TAGURI_PLUGINS/tabs.ts"]
keyword = "tab"
description = "Chrome のタブに切り替える"
ttl = 5

# herdr のエージェント。確認待ちが先頭。Enter でそのペインに移る
[[plugin]]
name = "agents"
command = ["$TAGURI_PLUGINS/agents.ts"]
keyword = "ag"
description = "herdr のエージェントに移る"
ttl = 5

# TODO（~/Documents/todo.md のチェックリスト）。@todo 文 で追加、Enter で完了
[[plugin]]
name = "todo"
command = ["$TAGURI_PLUGINS/todo.ts"]
kind = "query"
keyword = "todo"
description = "TODO を追加・完了する"
