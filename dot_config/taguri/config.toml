# taguri の設定。仕様は https://github.com/akameco/taguri/blob/main/docs/design.md
# 変えたら `taguri reload` で読み直す。

# Raycast と並べて使う間は cmd+shift+space。移行したら option+space にする
hotkey = "cmd+shift+space"
launch_at_login = true

# Raycast Script Commands（@raycast.* のコメントを持つスクリプト）
script_dirs = ["~/.config/raycast/scripts"]

# パネルの大きさ。scale はパネルの幅と余白の倍率（0.8〜1.6）、text_scale は文字と行の高さの倍率（0.7〜1.6）、
# rows は一覧に見える行数（4〜15）。
# 変えて `taguri reload` すると、アプリが起動し直して反映される
[appearance]
scale = 1.2
text_scale = 0.85
rows = 12
skin = "sakura"

[[plugin]]
name = "apps"
command = ["$TAGURI_PLUGINS/apps.ts"]
root = true

# #5892 / owner/repo#12。既定のリポジトリは TAGURI_GITHUB_REPO（work.zsh）
[[plugin]]
name = "github"
command = ["$TAGURI_PLUGINS/github-issue.ts"]
kind = "query"
match = '^(?:([\w.-]+/[\w.-]+))?#(\d+)$'

# ABC-123。ワークスペースは LINEAR_WORKSPACE（work.zsh）
[[plugin]]
name = "linear"
command = ["$TAGURI_PLUGINS/linear-issue.ts"]
kind = "query"
match = '^([A-Z][A-Z0-9]+-\d+)$'

# ghq のリポジトリ。Enter で herdr、cmd+Enter で VS Code、option+Enter で GitHub
[[plugin]]
name = "repos"
command = ["$TAGURI_PLUGINS/repos.ts"]
root = true

# --- @ で始めるコマンド（@ だけを打つと一覧が出る）---

[[plugin]]
name = "prs"
command = ["$TAGURI_PLUGINS/prs.ts"]
keyword = "pr"
description = "自分の PR とレビュー依頼"

[[plugin]]
name = "claude"
command = ["$TAGURI_PLUGINS/claude.ts"]
kind = "query"
keyword = "ai"
description = "Claude に聞く・クリップボードを要約／翻訳／返信案"

# クリップボード履歴（taguri 本体が記録する）。Enter で貼り付け、⌘Enter でコピーだけ、⌃Enter で履歴から消す
[[plugin]]
name = "clipboard"
command = ["builtin:clipboard"]
keyword = "clip"
description = "クリップボード履歴"

# Raycast 形式の snippets.json。@sn rev 1234 で {argument} に入れて貼る
[[plugin]]
name = "snippets"
command = ["$TAGURI_PLUGINS/snippets.ts"]
kind = "query"
keyword = "sn"
description = "スニペットを貼る"

# Chrome のタブ。Enter で切り替え、⌘Enter で URL をコピー、⌃Enter で閉じる
[[plugin]]
name = "tabs"
command = ["$TAGURI_PLUGINS/tabs.ts"]
keyword = "tab"
description = "Chrome のタブに切り替える"
ttl = 5

# herdr のエージェント。確認待ちが先頭。Enter でそのペインに移る
[[plugin]]
name = "agents"
command = ["$TAGURI_PLUGINS/agents.ts"]
keyword = "ag"
description = "herdr のエージェントに移る"
ttl = 5

# TODO（~/Documents/todo.md のチェックリスト）。@todo 文 で追加、Enter で完了
[[plugin]]
name = "todo"
command = ["$TAGURI_PLUGINS/todo.ts"]
kind = "query"
keyword = "todo"
description = "TODO を追加・完了する"

# スクリーンショットを新しい順に。Enter で貼る、⌘ でコピー、⌥ で Finder、⌃ でプレビュー
[[plugin]]
name = "screenshots"
command = ["$TAGURI_PLUGINS/screenshots.ts"]
keyword = "ss"
ttl = 3
label = "スクショ"
description = "スクリーンショットを選んで貼る"

# Claude にプラグインを作ってもらう。Enter で herdr の新しいタブに Claude Code を開く
[[plugin]]
name = "new"
command = ["$TAGURI_PLUGINS/new.ts"]
kind = "query"
keyword = "new"
label = "Claude"
description = "Claude にプラグインを作ってもらう"

# AI に taguri を変えてもらう（@taguri 猫のスキンを足したい）。スキン・配色・キー・プラグインなど何でも
[[plugin]]
name = "taguri"
command = ["$TAGURI_PLUGINS/taguri.ts"]
kind = "query"
keyword = "taguri"
label = "AI"
description = "AI に taguri を変えてもらう（スキン・配色・キーなど）"

# --- Raycast・Alfred の代わり（2026-11-09）---

# スリープ・ロック・再起動・ゴミ箱を空に・ダークモード と、システム設定の各画面
[[plugin]]
name = "system"
command = ["$TAGURI_PLUGINS/system.ts"]
root = true
ttl = 86400

# ファイルを探す（Spotlight）。@f 名前 [パスの語]、空なら最近使ったファイル。Enter で開く、⌘ で Finder、⌥ でパスをコピー、⌃ で貼る
[[plugin]]
name = "files"
command = ["$TAGURI_PLUGINS/files.ts"]
kind = "query"
keyword = "f"
description = "ファイルを探す"

# 動いているアプリを終了する。⌃Enter で強制終了
[[plugin]]
name = "quit"
command = ["$TAGURI_PLUGINS/quit.ts"]
keyword = "quit"
ttl = 2
description = "アプリを終了する"

# ウインドウに切り替える（アクセシビリティの許可が要る）。⌃Enter で閉じる
[[plugin]]
name = "windows"
command = ["$TAGURI_PLUGINS/windows.ts"]
keyword = "win"
ttl = 2
description = "ウインドウに切り替える"

# 絵文字を日本語・英語の名前で探して貼る
[[plugin]]
name = "emoji"
command = ["$TAGURI_PLUGINS/emoji.ts"]
keyword = "emoji"
ttl = 604800
description = "絵文字を貼る"

# Chrome のブックマーク
[[plugin]]
name = "bookmarks"
command = ["$TAGURI_PLUGINS/bookmarks.ts"]
keyword = "bm"
ttl = 300
description = "ブックマークを開く"

# 通貨の換算（100usd in jpy）。root で打つと、一覧の先頭に換算した額が出る。レートは open.er-api.com から 1 日 1 回取る
[[plugin]]
name = "currency"
command = ["$TAGURI_PLUGINS/currency.ts"]
kind = "inline"
match = '^\s*[\d.,]+\s*[A-Za-z]{3}\s+(?:in|to|as)\s+[A-Za-z]{3}\s*$'

# --- クイックリンク（名前を付けた URL・フォルダ・Web 検索）---

# @g 語 で検索。fallback = true なので、何も前置きせずに打った語も一覧の最後から検索できる
[[quicklink]]
name = "Google"
url = "https://www.google.com/search?q={query}"
keyword = "g"
fallback = true

[[quicklink]]
name = "GitHub を検索"
url = "https://github.com/search?q={query}&type=repositories"
keyword = "gh"
icon = "🐙"

[[quicklink]]
name = "英和辞書（Weblio）"
url = "https://ejje.weblio.jp/content/{query}"
keyword = "ej"
icon = "📖"

# macOS の辞書.app で引く
[[quicklink]]
name = "辞書"
url = "dict://{query}"
keyword = "d"
icon = "📚"

# {query} の無いものは、そのまま root の候補に出る
[[quicklink]]
name = "ダウンロード"
url = "~/Downloads"
icon = "📥"
