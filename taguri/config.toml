# taguri の設定。仕様は https://github.com/akameco/taguri/blob/main/docs/design.md
# 変えたら `taguri reload` で読み直す。

# Raycast と並べて使う間は cmd+shift+space。移行したら option+space にする
hotkey = "cmd+shift+space"
launch_at_login = true

# Raycast Script Commands（@raycast.* のコメントを持つスクリプト）
script_dirs = ["~/.config/raycast/scripts"]

# パネルの大きさ。scale はパネルの幅と余白の倍率（0.8〜1.6）、text_scale は文字と行の高さの倍率（0.7〜1.6）、
# rows は一覧に見える行数（4〜15）。
# 変えて `taguri reload` すると、アプリが起動し直して反映される
[appearance]
scale = 1.0
# 幅と大きさは pt で直接書く（前は scale = 1.3 を掛けていた: 820 × 1.3、400 × 1.3）
width = 1066.0
list_width = 520.0
preview_icon_size = 36.0  # 詳細のアイコン（前は 48 × 1.3 ≒ 62 で大きすぎた）
image_icon_size = 36.0    # 画像のアイコン（28 × 1.3）
rows = 12
skin = "relay"  # 通信屋のナギ（同梱）。前は "yuzuha"。ほかに "rin" "hoshiyo"
text_scale = 0.9
top = 0.29
remember_position = true  # 背景のドラッグで動かした位置に次も出す（覚えた位置が無い・画面に無ければ top の位置）

[behavior]
max_results_empty = 100

[[plugin]]
name = "apps"
command = ["builtin:apps"]
root = true

# #5892 / owner/repo#12。既定のリポジトリは TAGURI_GITHUB_REPO（work.zsh）
[[plugin]]
name = "github"
command = ["$TAGURI_PLUGINS/github-issue.ts"]
kind = "query"
match = '^(?:([\w.-]+/[\w.-]+))?#(\d+)$'

# ABC-123。ワークスペースは LINEAR_WORKSPACE（work.zsh）
[[plugin]]
name = "linear"
command = ["$TAGURI_PLUGINS/linear-issue.ts"]
kind = "query"
match = '^([A-Z][A-Z0-9]+-\d+)$'
app = "com.linear"  # Linear のアプリのアイコンを出す

# ghq のリポジトリ。Enter で herdr、cmd+Enter で VS Code、option+Enter で GitHub
[[plugin]]
name = "repos"
command = ["$TAGURI_PLUGINS/repos.ts"]
root = true

# --- @ で始めるコマンド（@ だけを打つと一覧が出る）---

[[plugin]]
name = "prs"
command = ["$TAGURI_PLUGINS/prs.ts"]
keyword = "pr"
description = "自分の PR とレビュー依頼"

# @gh owner/repo 修正 で、そのリポジトリの open な PR・Issue を絞り込む。
# repos と prs の候補で ⌘K →「PR・Issue を絞り込む」を選ぶと、ここへ来る
[[plugin]]
name = "gh"
command = ["$TAGURI_PLUGINS/gh.ts"]
kind = "query"
keyword = "gh"
# @ を付けずに gh owner/repo と打っても、ここへ来る（付け忘れると Google の検索になっていた）
prefix = "gh "
description = "リポジトリの PR・Issue を絞り込む"

# クリップボード履歴（taguri 本体が記録する）。Enter で貼り付け、⌘Enter でコピーだけ、⌃Enter で履歴から消す
[[plugin]]
name = "clipboard"
command = ["builtin:clipboard"]
keyword = "clipboard"
description = "クリップボード履歴"

# Raycast 形式の snippets.json。@snippet rev 1234 で {argument} に入れて貼る
[[plugin]]
name = "snippets"
command = ["builtin:snippets"]
kind = "query"
keyword = "snippet"
description = "スニペットを貼る"

# Chrome のタブ。Enter で切り替え、⌘Enter で URL をコピー、⌃Enter で閉じる。一番上は「新しいタブ」
[[plugin]]
name = "tabs"
command = ["builtin:tabs"]  # 前は $TAGURI_PLUGINS/tabs.ts。本体の組み込みはプレビューにページの絵・og:image を出す
keyword = "tab"
app = "com.google.Chrome"
description = "Chrome のタブに切り替える"
ttl = 5
frecency = false  # Chrome の並び順のまま（「新しいタブ」を一番上に保つ）

# herdr のエージェント。確認待ちが先頭。Enter でそのペインに移る
[[plugin]]
name = "agents"
command = ["$TAGURI_PLUGINS/agents.ts"]
keyword = "agent"
description = "herdr のエージェントに移る"
ttl = 5

# スクリーンショットを新しい順に。Enter で貼る、⌘ でコピー、⌥ で Finder、⌃ でプレビュー
[[plugin]]
name = "screenshots"
command = ["$TAGURI_PLUGINS/screenshots.ts"]
keyword = "screenshot"
ttl = 3
frecency = false  # 使ったものを上げず、新しい順のまま
label = "スクショ"
description = "スクリーンショットを選んで貼る"

# Claude にプラグインを作ってもらう。Enter で herdr の新しいタブに Claude Code を開く
[[plugin]]
name = "new"
command = ["$TAGURI_PLUGINS/new.ts"]
kind = "query"
keyword = "new"
label = "Claude"
description = "Claude にプラグインを作ってもらう"

# --- Raycast・Alfred の代わり（2026-11-09）---

# スリープ・ロック・再起動・ゴミ箱を空に・ダークモード と、システム設定の各画面
[[plugin]]
name = "system"
command = ["builtin:system"]
root = true
ttl = 86400

# ファイルを探す（Spotlight）。@file 名前 [パスの語]、空なら最近使ったファイル。~/名前 ならそのフォルダの中から。Enter で開く、⌘ で Finder、⌥ でパスをコピー、⌃ で貼る
[[plugin]]
name = "files"
command = ["builtin:files"]
kind = "query"
keyword = "file"
# ~ で始めると、そのフォルダの中を名前で絞り込む（~/Pic → ホームの Pictures）。Tab でフォルダの中に入る
match = '^(~.*)$'
description = "ファイルを探す"

# 動いているアプリを終了する。⌃Enter で強制終了
[[plugin]]
name = "quit"
command = ["builtin:quit"]
keyword = "quit"
ttl = 2
description = "アプリを終了する"

# ウインドウに切り替える（アクセシビリティの許可が要る）。⌃Enter で閉じる
[[plugin]]
name = "windows"
command = ["builtin:windows"]
keyword = "window"
ttl = 2
description = "ウインドウに切り替える"

# 前面のアプリのメニューの項目を探して実行する（@menu 書き出し）。アクセシビリティの許可が要る
[[plugin]]
name = "menu"
command = ["builtin:menu"]
keyword = "menu"
description = "前面のアプリのメニューを実行する"

# プロセスと、待ち受けているポート（@kill 3000 でポートからも探せる）。Enter で止める、⌃Enter で強制終了、⌥Enter で pid をコピー
[[plugin]]
name = "processes"
command = ["builtin:processes"]
keyword = "kill"
ttl = 2
label = "プロセス"
description = "プロセスを止める（ポートからも探せる）"

# 文字の変換（JSON の整形・大文字小文字・camelCase など・Base64・URL・UNIX 時刻・UUID）。何も打たなければクリップボードを変換
[[plugin]]
name = "text"
command = ["builtin:text"]
kind = "query"
keyword = "text"
label = "変換"
description = "文字を変換する（空ならクリップボード）"

# VS Code・Cursor・Windsurf で最近開いたフォルダ。Enter でそのエディタで開く、⌘Enter で Finder、⌥Enter でパスをコピー
[[plugin]]
name = "editors"
command = ["builtin:editors"]
keyword = "code"
ttl = 30
label = "エディタ"
description = "エディタで最近開いたフォルダ"

# Homebrew の formula と cask を探す（手元の一覧から。入っているものには「入っている」）。Enter でページ、⌘Enter で brew install をコピー
[[plugin]]
name = "brew"
command = ["builtin:brew"]
kind = "query"
keyword = "brew"
label = "Homebrew"
description = "Homebrew を探す"

# 絵文字を日本語・英語の名前で探して貼る
[[plugin]]
name = "emoji"
command = ["$TAGURI_PLUGINS/emoji.ts"]
keyword = "emoji"
ttl = 604800
description = "絵文字を貼る"

# Chrome のブックマーク
[[plugin]]
name = "bookmarks"
command = ["$TAGURI_PLUGINS/bookmarks.ts"]
keyword = "bookmark"
ttl = 300
description = "ブックマークを開く"

# Chrome の履歴。最後に開いた順。Enter で開く、⌘Enter で URL をコピー
[[plugin]]
name = "history"
command = ["$TAGURI_PLUGINS/history.ts"]
keyword = "history"
ttl = 60
description = "Chrome の履歴を開く"
label = "履歴"

# 通貨の換算（100usd in jpy）。root で打つと、一覧の先頭に換算した額が出る。レートは open.er-api.com から 1 日 1 回取る
[[plugin]]
name = "currency"
command = ["builtin:currency"]
kind = "inline"
match = '^\s*[\d.,]+\s*[A-Za-z]{3}\s+(?:in|to|as)\s+[A-Za-z]{3}\s*$'

# --- クイックリンク（名前を付けた URL・フォルダ・Web 検索）---

# @gg 語 で検索（1 文字の @g は @gh などの頭と重なり、空白を打つまで決まらないので 2 文字に）。
# fallback = true なので、何も前置きせずに打った語も一覧の最後から検索できる
[[quicklink]]
name = "Google"
url = "https://www.google.com/search?q={query}"
keyword = "gg"
fallback = true

[[quicklink]]
name = "GitHub を検索"
url = "https://github.com/search?q={query}&type=repositories"
# @gh は PR・Issue の絞り込み（gh）が使うので、頭の重ならない名前にする
keyword = "github"
icon = "🐙"
group = "GitHub"  # root で github と打つと @pr・@gh と並んで出る

[[quicklink]]
name = "英和辞書（Weblio）"
url = "https://ejje.weblio.jp/content/{query}"
keyword = "ej"
icon = "📖"

# macOS の辞書.app で引く
[[quicklink]]
name = "辞書"
url = "dict://{query}"
keyword = "d"
icon = "📚"

# {query} の無いものは、そのまま root の候補に出る
[[quicklink]]
name = "ダウンロード"
url = "~/Downloads"
icon = "📥"

[aliases]
# 短い keyword。@f でも @file でも呼べる
"@f" = "@file"
"@sn" = "@snippet"
"@bm" = "@bookmark"
"@hist" = "@history"
"@tx" = "@text"
"@ag" = "@agent"
"@ss" = "@screenshot"
"@win" = "@window"
"@clip" = "@clipboard"

[hotkeys]
"cmd+shift+c" = "@clipboard "
